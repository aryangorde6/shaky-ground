services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: shaky-falkordb
    ports:
      - "6379:6379"   # database
      - "3000:3000"   # FalkorDB Browser
    volumes:
      - falkordb-data:/var/lib/falkordb/data   # keeps the graph across restarts
    restart: unless-stopped

volumes:
  falkordb-data:
    name: shaky-falkordb-data
