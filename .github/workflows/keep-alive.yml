# The live demo's FalkorDB Cloud free instance stops after a day without use, so read the graph through
# the live site every 3 hours. A failed run means the site or the graph is down.
name: keep-alive

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the graph through the live site
        env:
          SITE: https://shaky-ground-production.up.railway.app
        run: curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 60 -o /dev/null -w "%{http_code} in %{time_total}s\n" "$SITE/api/checks"
